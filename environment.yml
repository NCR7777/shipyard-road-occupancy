# The same versions as conda builds (Anaconda "defaults" channel), the environment in which the experiments ran:
#   conda env create -f environment.yml && conda activate shipyard-road-occupancy
name: shipyard-road-occupancy
channels:
  - defaults
dependencies:
  - python=3.13.5
  - numpy=2.1.3
  - scipy=1.15.3
  - scikit-learn=1.6.1
  - joblib=1.4.2
  - threadpoolctl=3.5.0
  - pytest=8.3.4
  - pluggy=1.5.0
  - iniconfig=1.1.1
  - packaging=24.2
  - colorama=0.4.6
  - pip
  - pip:
      - psutil==7.2.2
      - ortools==9.15.6755
